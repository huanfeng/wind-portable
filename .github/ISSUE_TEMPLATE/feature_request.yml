name: 功能建议
description: 为便携启动器提出一个新功能或改进建议
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述你期望的功能，我们会认真评估。

        本仓库只负责**便携启动器**。输入法引擎、词库、界面主题等方面的建议请到
        [WindInput 主仓库](https://github.com/huanfeng/WindInput/issues) 提交。

  - type: textarea
    id: problem
    attributes:
      label: 问题或需求
      description: 你希望解决什么问题？或在什么场景下需要这个功能？
      placeholder: 在多台电脑间用 U 盘携带输入法时，我经常遇到……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 描述你理想中的功能表现
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你是否考虑过其他替代方案？

  - type: dropdown
    id: category
    attributes:
      label: 功能类别
      options:
        - 启停 / TSF 注册 / 开机自启
        - 与已安装版的冲突检测
        - 部署与在线更新
        - 托盘与窗口界面
        - 命令行 (CLI)
        - 其他
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 其他信息
      description: 其他补充说明、截图或参考
