[package]
name = "wind_portable"
version = "0.0.1-alpha"
edition = "2021"
description = "清风输入法便携启动器（绿色版）"
license = "MIT"
repository = "https://github.com/huanfeng/wind-portable"
homepage = "https://windinput.com"
readme = "README.md"

[[bin]]
name = "wind_portable"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# 便携包部署/在线更新解压。纯 Rust deflate 后端（无 C 依赖），可交叉编译。
zip = { version = "2", default-features = false, features = ["deflate"] }

# windui 仅支持 Windows/macOS，且本启动器只面向 Windows 目标（cargo-xwin 交叉编译）。
# 放进 windows target deps：Linux host 上 `cargo test` 跑纯逻辑（不拉 windui），
# Windows 目标构建时才引入 GUI 框架与全部副作用模块。
[target.'cfg(windows)'.dependencies]
windui = { version = "0.11", default-features = false }
# 解码内嵌 app.ico → RGBA 供托盘图标使用（纯 Rust）。
ico = "0.4"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Controls_Dialogs",
    # TaskDialogIndirect（现代命令链接对话框）；结构体 Default 依赖 WindowsAndMessaging（已含）。
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
] }

[build-dependencies]
# 嵌入 exe 资源：图标 + 版本信息 + 应用清单(Common-Controls 6.0)。
# 用 winresource（与 wind_input 同款）而非 embed-resource —— 后者在原生 windows CI 的
# rc.exe 编译失败会连 manifest 一起丢，致 exe 因缺 comctl32 v6 的 TaskDialogIndirect
# 入口点而无法启动；winresource 在同一 CI 环境(wind_input)已验证可正常嵌入。
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
